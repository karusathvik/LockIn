<!DOCTYPE html>
<html>
<head>
  <title>Locked In Settings</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
      background: #f9f9f9;
      color: #333;
    }

    h2 {
      border-bottom: 2px solid #ccc;
      padding-bottom: 0.3rem;
      margin-top: 2rem;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #fff;
      border: 1px solid #ddd;
      padding: 10px;
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 6px;
    }

    input[type="text"] {
      padding: 8px;
      margin-top: 10px;
      margin-right: 10px;
      width: 200px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      padding: 8px 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .section {
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <div class="section">
    <h2>Blocked Domains</h2>
    <ul id="domainList"></ul>
    <input type="text" id="domainInput" placeholder="e.g. reddit.com">
    <button id="addDomain">Add</button>
  </div>

  <div class="section">
    <h2>Blocked Keywords</h2>
    <ul id="keywordList"></ul>
    <input type="text" id="keywordInput" placeholder="e.g. games">
    <button id="addKeyword">Add</button>
  </div>

  <div class="section">
    <h2>Allowed Domains</h2>
    <ul id="allowList"></ul>
    <input type="text" id="allowInput" placeholder="e.g. chat.openai.com">
    <button id="addAllow">Allow</button>
  </div>

  <script src="settings.js"></script>
</body>
</html>
